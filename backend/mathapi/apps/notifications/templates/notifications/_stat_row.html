{% comment %}Usage: {% include "notifications/_stat_row.html" with label="Recent average" value="27%" value_color="#f43f5e" %}{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:2px;">
  <tr>
    <td style="padding:7px 0;border-bottom:1px solid #f0f0f3;font-size:13px;color:#666677;">{{ label }}</td>
    <td align="right" style="padding:7px 0;border-bottom:1px solid #f0f0f3;font-size:13px;font-weight:700;color:{{ value_color|default:'#1a1a26' }};font-family:monospace;">{{ value }}</td>
  </tr>
</table>
