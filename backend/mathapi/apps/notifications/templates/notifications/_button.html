{% comment %}Usage: {% include "notifications/_button.html" with url=some_url label="View details" color="#3b82f6" %}{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:20px;">
  <tr>
    <td style="border-radius:10px;background-color:{{ color|default:'#3b82f6' }};">
      <a href="{{ url }}" target="_blank" style="display:inline-block;padding:11px 22px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">
        {{ label }} »
      </a>
    </td>
  </tr>
</table>
